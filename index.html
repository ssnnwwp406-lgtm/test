<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karar Developer | Dev Hub</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --danger-color: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .admin-btn {
            background: transparent;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .admin-btn:hover {
            background: var(--accent-color);
            color: #000;
        }

        .hero {
            text-align: center;
            padding: 3rem 1rem 1.5rem;
            background: radial-gradient(circle at top, #1e293b 0%, var(--bg-color) 70%);
        }

        .hero h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .hero p {
            color: var(--text-muted);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            flex-grow: 1;
        }

        /* Admin Section Form */
        .admin-panel {
            display: none; /* hidden by default */
            background-color: var(--card-bg);
            border: 2px dashed var(--accent-color);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        .admin-panel h2 {
            margin-bottom: 1rem;
            color: var(--accent-color);
            font-size: 1.2rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 0.7rem;
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #fff;
            outline: none;
        }

        .btn-submit {
            background: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 0.7rem 1.5rem;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Controls */
        .controls {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .search-bar {
            flex-grow: 1;
            max-width: 400px;
            position: relative;
        }

        .search-bar input {
            width: 100%;
            padding: 0.8rem 1rem 0.8rem 2.5rem;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            outline: none;
        }

        .search-bar i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .filter-buttons button {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 0.8rem 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            margin-right: 0.3rem;
        }

        .filter-buttons button.active, .filter-buttons button:hover {
            background-color: var(--accent-color);
            color: #000;
            font-weight: bold;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-tag {
            align-self: flex-start;
            font-size: 0.75rem;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            background-color: rgba(56, 189, 248, 0.1);
            color: var(--accent-color);
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 1rem;
        }

        .card h3 { margin-bottom: 0.5rem; }
        .card p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem; }

        .btn-download {
            background-color: var(--accent-color);
            color: #0f172a;
            text-decoration: none;
            text-align: center;
            padding: 0.6rem;
            border-radius: 6px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .empty-msg {
            text-align: center;
            grid-column: 1 / -1;
            color: var(--text-muted);
            padding: 3rem;
        }

        footer {
            text-align: center;
            padding: 2rem;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <i class="fa-solid fa-code"></i> Karar Developer
        </div>
        <button class="admin-btn" onclick="toggleAdmin()"><i class="fa-solid fa-lock"></i> Owner Login</button>
    </header>

    <section class="hero">
        <h1>Karar Developer Hub</h1>
        <p>Explore & Download Custom Plugins, Scripts, Setups, and Files.</p>
    </section>

    <div class="container">

        <div class="admin-panel" id="adminPanel">
            <h2><i class="fa-solid fa-plus-circle"></i> Add New Item (Owner Only)</h2>
            <form id="uploadForm" onsubmit="addNewItem(event)">
                <div class="form-group">
                    <label>Title</label>
                    <input type="text" id="itemTitle" placeholder="e.g., Auto Backup Script" required>
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="itemCategory">
                        <option value="plugin">Plugin</option>
                        <option value="script">Script</option>
                        <option value="setup">Setup</option>
                        <option value="file">File</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="itemDesc" rows="2" placeholder="Short description..." required></textarea>
                </div>
                <div class="form-group">
                    <label>File URL / Download Link</label>
                    <input type="url" id="itemLink" placeholder="https://..." required>
                </div>
                <button type="submit" class="btn-submit">Publish Item</button>
            </form>
        </div>

        <div class="controls">
            <div class="search-bar">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Search..." onkeyup="filterItems()">
            </div>
            <div class="filter-buttons">
                <button class="active" onclick="filterCategory('all', this)">All</button>
                <button onclick="filterCategory('plugin', this)">Plugins</button>
                <button onclick="filterCategory('script', this)">Scripts</button>
                <button onclick="filterCategory('setup', this)">Setups</button>
                <button onclick="filterCategory('file', this)">Files</button>
            </div>
        </div>

        <div class="grid" id="resourceGrid">
            <div class="empty-msg" id="emptyMsg">No resources added yet. Stay tuned!</div>
        </div>
    </div>

    <footer>
        &copy; 2026 Karar Developer. All rights reserved.
    </footer>

    <script>
        // كلمة السر الخاصة بك للدخول للوحة الرفع (يمكنك تغييرها)
        const ADMIN_PASSWORD = "karar123pass"; 
        let isOwner = false;

        function toggleAdmin() {
            if (!isOwner) {
                let password = prompt("Enter Owner Password to Upload:");
                if (password === ADMIN_PASSWORD) {
                    isOwner = true;
                    document.getElementById('adminPanel').style.display = 'block';
                    alert("Welcome Karar! You can now upload items.");
                } else if (password !== null) {
                    alert("Wrong Password! Access Denied.");
                }
            } else {
                let panel = document.getElementById('adminPanel');
                panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
            }
        }

        function addNewItem(e) {
            e.preventDefault();
            
            const title = document.getElementById('itemTitle').value;
            const category = document.getElementById('itemCategory').value;
            const desc = document.getElementById('itemDesc').value;
            const link = document.getElementById('itemLink').value;

            const grid = document.getElementById('resourceGrid');
            const emptyMsg = document.getElementById('emptyMsg');

            if (emptyMsg) {
                emptyMsg.style.display = 'none';
            }

            const card = document.createElement('div');
            card.className = 'card';
            card.setAttribute('data-category', category);

            card.innerHTML = `
                <span class="card-tag">${category}</span>
                <h3>${title}</h3>
                <p>${desc}</p>
                <a href="${link}" target="_blank" class="btn-download"><i class="fa-solid fa-download"></i> Download</a>
            `;

            grid.appendChild(card);

            // Reset form
            document.getElementById('uploadForm').reset();
            alert("Item Published Successfully!");
        }

        function filterCategory(category, btn) {
            document.querySelectorAll('.filter-buttons button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const cards = document.querySelectorAll('.card');
            cards.forEach(card => {
                if (category === 'all' || card.getAttribute('data-category') === category) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        function filterItems() {
            const searchInput = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('.card');

            cards.forEach(card => {
                const title = card.querySelector('h3').innerText.toLowerCase();
                const desc = card.querySelector('p').innerText.toLowerCase();
                if (title.includes(searchInput) || desc.includes(searchInput)) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }
    </script>
</body>
</html>
